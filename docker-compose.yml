services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stockpulse
      MYSQL_USER: stockpulse
      MYSQL_PASSWORD: stockpulse
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/stockpulse?serverTimezone=UTC
      REDIS_URL: redis://redis:6379
      RABBIT_HOST: rabbitmq
    ports: ["8080:8080"]
    depends_on: [mysql, redis, rabbitmq]
